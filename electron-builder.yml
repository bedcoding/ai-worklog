appId: dev.bedcoding.claude-worklog
productName: WorkLog
directories:
  output: dist-release
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
mac:
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Apple Developer 인증서 없이 배포 (README의 Gatekeeper 안내 참고)
  identity: null
  category: public.app-category.productivity
  extendInfo:
    LSUIElement: true # Dock 아이콘 없는 메뉴바 상주 앱
# Apple Silicon은 서명되지 않은 바이너리를 실행하지 않으므로 인증서 없이 ad-hoc 서명한다
afterPack: scripts/ad-hoc-sign.mjs
publish:
  provider: github
