appId: dev.bedcoding.ai-worklog
productName: WorkLog
directories:
  output: dist-release
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
mac:
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Apple Developer 인증서 없이 배포 (README의 Gatekeeper 안내 참고)
  identity: null
  category: public.app-category.productivity
  extendInfo:
    LSUIElement: true # Dock 아이콘 없는 메뉴바 상주 앱
win:
  # 크기별로 직접 찍은 프레임을 담은 .ico (scripts/gen-tray-icon.mjs 가 생성).
  # PNG만 주면 electron-builder가 512px를 bicubic 축소해 넣는데, 16~32px 프레임이
  # 회색 덩어리로 뭉개진다. 최대 프레임은 256px 이상이어야 빌드가 통과한다.
  icon: resources/icon.ico
  # 인증서가 없으므로 signtool 호출을 건너뛴다 (README의 SmartScreen 안내 참고).
  # signAndEditExecutable: false 로 하면 아이콘·버전정보 주입까지 사라지므로 반드시 이 옵션을 쓴다.
  signExecutable: false
  # artifactName은 반드시 win 스코프에 둔다 — 최상위에 두면 mac dmg/zip 파일명까지 바뀐다.
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  target:
    # portable은 매 실행마다 %TEMP%에 재전개되어 setLoginItemSettings의 자동 시작이 깨지고,
    # zip은 언인스톨러·바로가기가 없어 트레이 상주 앱과 맞지 않는다. nsis per-user 단일로 간다.
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false # 마법사형 설치 (기본 true = 원클릭)
  # perMachine: false + oneClick: false 조합에서는 '설치 대상(현재 사용자 / 모든 사용자)'
  # 선택 페이지가 표시된다. 기본 선택은 현재 사용자(%LOCALAPPDATA%\Programs\WorkLog, UAC 없음)이고,
  # 사용자가 '모든 사용자'를 고르면 UAC 승격 후 %PROGRAMFILES%에 설치된다.
  # 이 페이지는 allowElevation으로 없앨 수 없다 — 템플릿이 perMachine: true(INSTALL_MODE_PER_ALL_USERS)
  # 일 때만 건너뛴다(app-builder-lib/templates/nsis/assistedInstaller.nsh).
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 트레이 상주 앱의 최대 약점(아이콘을 잃어버리면 켤 수 없다)을 바로가기로 보완한다
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WorkLog
  deleteAppDataOnUninstall: false # 제거 시 요약·기안 캐시 보존
# Apple Silicon은 서명되지 않은 바이너리를 실행하지 않으므로 인증서 없이 ad-hoc 서명한다
# (darwin 가드가 있어 윈도우 빌드에서는 no-op)
afterPack: scripts/ad-hoc-sign.mjs
publish:
  provider: github
