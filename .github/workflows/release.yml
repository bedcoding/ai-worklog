name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # src/ 정적 검사라 플랫폼 독립적이다. 한 잡에서만 돌린다
      - run: npm run check:no-network
      - run: npm test
      - run: npm run build
      # 업로드는 release 잡이 전담한다. 빌드 잡은 파일만 만든다
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist-release/*.dmg
            dist-release/*-mac.zip
          if-no-files-found: error

  build-win:
    # build-mac 과 병렬로 돈다. 더 이상 릴리스 생성을 두고 경쟁하지 않는다
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Electron dist(~145MB) 재다운로드를 줄인다
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: dist-release/*.exe
          if-no-files-found: error

  release:
    # 릴리스를 만드는 곳은 여기 하나뿐이다. 두 빌드가 모두 끝난 뒤에만 돈다.
    # electron-builder 의 --publish 로 각 잡이 올리면 "릴리스가 없으면 만든다"가
    # 동시에 실행되어 같은 태그로 릴리스가 두 개 생긴다(v0.1.0 에서 실제로 발생).
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # blockmap 과 latest*.yml 은 electron-updater 의 차등 업데이트용이다.
      # 이 앱은 네트워크 호출이 0건이라 자동 업데이트가 없으므로 올리지 않는다
      # 받는 사람은 파일명만 보고 무엇을 골라야 할지 알 수 없다. arm64 가 붙지 않은 쪽이
      # 인텔용이라는 것도, 서명이 없어 첫 실행에 경고가 뜬다는 것도 여기 적어 둔다.
      # --notes 는 --generate-notes 가 만든 커밋 목록 앞에 붙는다
      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ### 어떤 파일을 받아야 하나

          | 환경 | 파일 |
          | --- | --- |
          | macOS (Apple Silicon, M1~M4) | \`WorkLog-${VER}-arm64.dmg\` |
          | macOS (Intel) | \`WorkLog-${VER}.dmg\` |
          | Windows (x64) | \`WorkLog-Setup-${VER}-x64.exe\` |

          맥은 파일명에 \`arm64\` 가 붙은 쪽이 Apple Silicon, 붙지 않은 쪽이 Intel 입니다.
          \`.zip\` 은 \`.dmg\` 와 같은 앱이라 둘 다 받을 필요는 없습니다. dmg 가 열리지 않을 때 쓰는 대안입니다.

          ### 첫 실행

          서명 인증서 없이 배포하므로 처음 열 때 경고가 뜹니다.

          - **macOS**: Applications 로 옮긴 뒤 \`xattr -cr /Applications/WorkLog.app\`, 또는 우클릭 → 열기
          - **Windows**: "Windows에서 PC를 보호했습니다" → 추가 정보 → 실행

          ### 요구 사항

          Claude Code CLI 가 설치되어 있어야 합니다 (\`claude --version\` 이 동작하면 OK).
          경로가 특이하면 설정 탭에서 직접 지정할 수 있습니다.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WorkLog $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            artifacts/mac/* artifacts/win/*
